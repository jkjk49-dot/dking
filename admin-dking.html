<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0613">
<meta name="robots" content="noindex,nofollow">
<title>Dking Admin</title>
<style>
:root{--g:#4b2a7a;--gold:#d4af37;--bg:#f4f1f8;--line:#ddd3ea;--red:#c0392b;--mut:#6f6580}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1a1326;padding:14px;padding-bottom:90px;max-width:1180px;margin:0 auto}
h1{font-size:22px;color:var(--g)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px}
.pri{background:linear-gradient(180deg,#5b3590,#3b1d63);color:#fff;border-color:var(--gold);font-weight:700}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;background:#fff;min-width:0}
label{font-size:11px;font-weight:600;color:var(--mut);display:block;margin-bottom:2px}
#login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tools input{max-width:320px}.cnt{font-size:13px;color:var(--mut);white-space:nowrap}
.hd{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;display:grid;gap:6px 8px;align-items:end;
 grid-template-columns:64px 1fr 1fr;grid-template-areas:"th nama nama" "th harga unit" "kat kat stok" "desc desc desc" "acts acts acts"}
.th{grid-area:th;width:64px;height:64px;border-radius:10px;border:1px dashed #b7a6d0;background:#faf8fd;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:11px;color:var(--mut);text-align:center;align-self:start}
.th img{width:100%;height:100%;object-fit:cover}
.c-nama{grid-area:nama}.c-harga{grid-area:harga}.c-unit{grid-area:unit}.c-kat{grid-area:kat}.c-stok{grid-area:stok}.c-desc{grid-area:desc}.c-acts{grid-area:acts}
.c-desc textarea{resize:vertical;height:38px}
.c-acts{display:flex;gap:6px;align-items:center;justify-content:space-between}
.mini{padding:6px 10px;font-size:13px;min-height:36px}.del{color:var(--red)}
.st{font-size:12px;color:var(--mut)} .ok{color:var(--g);font-weight:600}.err{color:var(--red);font-weight:600}
.msg{background:#f8f1d8;border:1px solid #e6d58f;border-radius:10px;padding:9px;font-size:13px;margin-bottom:10px}
.card.out .c-stok select{border-color:#e2b3ad;background:#fdf1ef}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--gold);padding:10px 14px;box-shadow:0 -4px 14px #0002;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.bar button{width:100%;max-width:1180px;display:block;margin:0 auto;padding:12px;font-size:16px}
.hide{display:none!important}
@media(min-width:900px){
.hd,.card{grid-template-columns:56px minmax(150px,2fr) 84px 84px 120px 92px minmax(160px,2.4fr) 120px;grid-template-areas:"th nama harga unit kat stok desc acts"}
.hd{display:grid;gap:8px;padding:0 8px 4px;font-size:11px;font-weight:600;color:var(--mut)}
.hd span:first-child{grid-column:1}
.card{align-items:center;padding:6px 8px;margin-bottom:6px}
.th{width:48px;height:48px;align-self:center}
.c-desc textarea{height:38px}
.card label{display:none}
}
</style>
</head>
<body>

<div id="setup" class="msg hide">Sambungan Supabase belum diisi. Isi <b>SUPABASE_URL</b> dan <b>SUPABASE_KEY</b> dalam fail <b>config.js</b>.</div>

<form id="login" class="hide">
  <h1>Dking Admin</h1>
  <div><label for="em">Emel</label><input id="em" type="email" autocomplete="username" required></div>
  <div><label for="pw">Kata laluan</label><input id="pw" type="password" autocomplete="current-password" required></div>
  <button class="pri" type="submit">Log masuk</button>
  <div id="lerr" class="st err"></div>
</form>

<div id="app" class="hide">
  <div class="top"><h1>Urus Produk</h1><button id="out" class="mini">Log keluar</button></div>
  <div class="msg">Semua perubahan disimpan terus dan customer nampak serta-merta. Tekan kotak gambar untuk upload.</div>
  <div class="tools"><input id="q" type="search" placeholder="Cari produk..."><span class="cnt" id="cnt"></span></div>
  <div class="hd"><span>Gambar</span><span>Nama</span><span>Harga RM</span><span>Unit</span><span>Kategori</span><span>Stok</span><span>Penerangan</span><span></span></div>
  <div id="list"></div>
</div>
<div class="bar hide" id="addbar"><button class="pri" id="add">+ Tambah produk</button></div>
<input type="file" id="pick" accept="image/*" hidden>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s);
const C=window.DKING_CONFIG||{};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let sb=null, items=[], pickId=null;

if(!C.SUPABASE_URL||!C.SUPABASE_KEY||typeof supabase==="undefined"){ $("#setup").classList.remove("hide"); }
else { sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{db:{schema:"dking_shop"}}); init(); }

async function init(){
  const {data}=await sb.auth.getSession();
  data.session?showApp():showLogin();
}
function showLogin(){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); $("#addbar").classList.add("hide"); }
async function showApp(){
  $("#login").classList.add("hide"); $("#app").classList.remove("hide"); $("#addbar").classList.remove("hide");
  await load();
}
$("#login").onsubmit=async e=>{
  e.preventDefault(); $("#lerr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error){$("#lerr").textContent="Emel atau kata laluan salah.";return}
  showApp();
};
$("#out").onclick=async()=>{await sb.auth.signOut();showLogin()};

async function load(){
  const {data,error}=await sb.from("products").select("*").order("urutan").order("created_at");
  if(error){$("#list").innerHTML=`<div class="msg">Gagal muat produk: ${esc(error.message)}. Pastikan SQL setup sudah dijalankan.</div>`;return}
  items=data; render();
}
const BASE_CATS=["Segar","Beku","Lain-lain"];
function catOptions(cur){
  const all=[...new Set([...BASE_CATS,...items.map(x=>x.kategori).filter(Boolean)])];
  return all.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("")+`<option value="__new">+ Kategori baru…</option>`;
}
function render(){
  $("#list").innerHTML=items.length?items.map((p,i)=>`
  <div class="card ${p.stok==="habis"?"out":""}" data-id="${p.id}">
    <div class="th" data-act="img" title="Tukar gambar">${p.gambar?`<img src="${esc(p.gambar)}" alt="" loading="lazy">`:"+ Gambar"}</div>
    <div class="c-nama"><label>Nama barang</label><input data-f="nama" value="${esc(p.nama)}" placeholder="Nama barang"></div>
    <div class="c-harga"><label>Harga (RM)</label><input data-f="harga" inputmode="decimal" value="${esc(p.harga)}"></div>
    <div class="c-unit"><label>Unit</label><input data-f="unit" value="${esc(p.unit)}" placeholder="kg / pek"></div>
    <div class="c-kat"><label>Kategori</label><select data-f="kategori">${catOptions(p.kategori)}</select></div>
    <div class="c-stok"><label>Stok</label><select data-f="stok"><option value="ada" ${p.stok!=="habis"?"selected":""}>Ada</option><option value="habis" ${p.stok==="habis"?"selected":""}>Habis</option></select></div>
    <div class="c-desc"><label>Penerangan</label><textarea data-f="penerangan" rows="1" placeholder="Penerangan ringkas">${esc(p.penerangan)}</textarea></div>
    <div class="c-acts"><span class="st" data-st></span>
      <span><button class="mini" data-act="up" ${i==0?"disabled":""}>↑</button> <button class="mini" data-act="dn" ${i==items.length-1?"disabled":""}>↓</button> <button class="mini del" data-act="del">✕</button></span>
    </div>
  </div>`).join(""):`<div class="msg">Belum ada produk. Tekan "Tambah produk".</div>`;
  filter();
}
function filter(){
  const q=($("#q").value||"").toLowerCase().trim(); let n=0;
  document.querySelectorAll("#list .card").forEach(c=>{const p=find(c.dataset.id);const ok=!q||(p&&(p.nama||"").toLowerCase().includes(q));c.classList.toggle("hide",!ok);if(ok)n++});
  $("#cnt").textContent=n+" produk";
}
$("#q").addEventListener("input",filter);
const find=id=>items.find(x=>x.id===id);
function setSt(id,t,cls){const el=document.querySelector(`[data-id="${id}"] [data-st]`); if(el){el.textContent=t;el.className="st "+(cls||"")}}
async function save(id,patch){
  setSt(id,"Menyimpan...");
  const {error}=await sb.from("products").update(patch).eq("id",id);
  error?setSt(id,"Gagal: akaun ini bukan admin?","err"):setSt(id,"Disimpan ✓","ok");
  return !error;
}
const timers={};
document.addEventListener("input",e=>{
  const t=e.target, card=t.closest(".card"); if(!card||!t.dataset.f) return;
  const id=card.dataset.id, p=find(id); if(!p) return;
  let v=t.value;
  if(t.dataset.f==="kategori"&&v==="__new"){const n=(prompt("Nama kategori baru:")||"").trim(); if(!n){t.value=p.kategori;return} v=n; p.kategori=n; save(id,{kategori:n}); render(); return}
  if(t.dataset.f==="stok") card.classList.toggle("out",v==="habis");
  if(t.dataset.f==="harga") v=parseFloat(String(v).replace(/[^\d.]/g,""))||0;
  p[t.dataset.f]=v;
  clearTimeout(timers[id+t.dataset.f]);
  timers[id+t.dataset.f]=setTimeout(()=>save(id,{[t.dataset.f]:v}),700);
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const card=b.closest(".card"); const id=card.dataset.id, a=b.dataset.act;
  if(a==="img"){pickId=id;$("#pick").value="";$("#pick").click()}
  if(a==="del"){
    const p=find(id); if(!confirm("Padam "+(p.nama||"produk ini")+"?"))return;
    const {error}=await sb.from("products").delete().eq("id",id);
    if(error){setSt(id,"Gagal padam","err");return}
    items=items.filter(x=>x.id!==id); render();
  }
  if(a==="up"||a==="dn"){
    const i=items.findIndex(x=>x.id===id), j=a==="up"?i-1:i+1; if(j<0||j>=items.length)return;
    [items[i],items[j]]=[items[j],items[i]];
    const ups=[]; items.forEach((p,k)=>{if(p.urutan!==k){p.urutan=k;ups.push(sb.from("products").update({urutan:k}).eq("id",p.id))}});
    render(); await Promise.all(ups);
  }
});
$("#add").onclick=async()=>{
  const max=items.reduce((m,p)=>Math.max(m,p.urutan||0),-1);
  const {data,error}=await sb.from("products").insert({urutan:max+1}).select().single();
  if(error){alert("Gagal tambah: pastikan anda log masuk sebagai admin.");return}
  items.push(data); $("#q").value=""; render();
  document.querySelector(`[data-id="${data.id}"]`).scrollIntoView({behavior:"smooth",block:"center"});
};
/* Upload gambar: kecilkan ke 800px JPEG, simpan di Supabase Storage */
$("#pick").onchange=e=>{
  const f=e.target.files[0]; if(!f||!pickId) return;
  const id=pickId, img=new Image(), url=URL.createObjectURL(f);
  setSt(id,"Memuat naik gambar...");
  img.onload=()=>{
    const M=640,r=Math.min(1,M/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    c.toBlob(async blob=>{
      const path=id+"-"+Date.now()+".jpg";
      const up=await sb.storage.from("produk").upload(path,blob,{contentType:"image/jpeg",upsert:true});
      if(up.error){setSt(id,"Gagal upload gambar: "+up.error.message,"err");return}
      const pub=sb.storage.from("produk").getPublicUrl(path).data.publicUrl;
      const old=find(id).gambar;
      if(await save(id,{gambar:pub})){
        find(id).gambar=pub; render();
        const m=old&&old.split("/produk/")[1]; if(m) sb.storage.from("produk").remove([m]);
      }
    },"image/jpeg",0.72);
  };
  img.onerror=()=>setSt(id,"Gambar tak dapat dibaca. Guna JPG atau PNG.","err");
  img.src=url;
};
</script>
</body>
</html>
